# SmolLM2-360M Standard adapter — age_5_11
# Train with: mlx_lm.lora --config configs/smollm2_standard_age_5_11_lora.yaml
#
# SmolLM2-360M has 32 transformer layers.
# Standard config: rank 8, 16 layers → adapts top 50% of the stack.
# Data uses empty system messages (--add-empty-system) to suppress the ChatML
# default "You are a helpful AI assistant named SmolLM..." injection.

model: "mlx-community/SmolLM2-360M-Instruct"
train: true
fine_tune_type: "lora"
data: "data/smollm/age_5_11"

num_layers: 16

lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0

batch_size: 4
iters: 600
learning_rate: 1e-5

lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [1e-5, 600]

mask_prompt: true
adapter_path: "adapters/crossarch_v2/smollm2_standard_age_5_11_lora"
save_every: 100
steps_per_report: 10
steps_per_eval: 60
val_batches: -1
max_seq_length: 768
seed: 42
