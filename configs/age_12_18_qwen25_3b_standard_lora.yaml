# age_12_18 adapter — Qwen 2.5 3B, standard config (rank 8, 16 layers)
# 36 transformer layers total; 16 layers adapted (44%).
# Train with: mlx_lm.lora --config configs/age_12_18_qwen25_3b_standard_lora.yaml

model: "mlx-community/Qwen2.5-3B-Instruct-4bit"
train: true
fine_tune_type: "lora"
data: "data/age_12_18"

num_layers: 16

lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0

batch_size: 4
iters: 600
learning_rate: 1e-5

lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [1e-5, 600]

mask_prompt: true

adapter_path: "adapters/qwen25_3b_standard/age_12_18"

save_every: 100
steps_per_report: 10
steps_per_eval: 60
val_batches: -1
max_seq_length: 768
seed: 42
