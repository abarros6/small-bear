# ages 5-11 adapter — 3B base model (primary)
# Train with: mlx_lm.lora --config configs/age_5_11_3b_lora.yaml
#
# iters=600 @ batch_size=4 → ~2.4 passes over 475 examples (assuming ~500 total).

model: "mlx-community/Llama-3.2-3B-Instruct-4bit"
train: true
fine_tune_type: "lora"
data: "data/age_5_11"

# LoRA — use mlx-lm defaults (scale=20.0, rank=8)
# DO NOT set scale=alpha/rank; that is a different convention and causes poor results.
num_layers: 16
lora_parameters:
  rank: 8
  scale: 20.0
  dropout: 0.0

batch_size: 4
iters: 600
learning_rate: 1e-5
lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [1e-5, 600]

# Only train on assistant response tokens (not user prompt)
mask_prompt: true

adapter_path: "adapters/3b/age_5_11"
save_every: 100

steps_per_report: 10
steps_per_eval: 60
val_batches: -1

max_seq_length: 768
seed: 42
