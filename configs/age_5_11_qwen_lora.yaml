# ages 5-11 adapter — Qwen2-0.5B bfloat16 base model (Qwen ablation)
# Train with: mlx_lm.lora --config configs/age_5_11_qwen_lora.yaml
# Note: bfloat16 base → standard LoRA (not QLoRA). mlx_lm.lora handles this automatically.

model: "Qwen/Qwen2-0.5B-Instruct-MLX"
train: true
fine_tune_type: "lora"
data: "data/age_5_11"

# --- LoRA Architecture ---
# Qwen2-0.5B has 24 transformer layers.
# num_layers=8 adapts the upper 8 layers (upper 33%).
# Consistent absolute layer count with the 3B and 1B configs.
num_layers: 8

lora_parameters:
  rank: 4
  scale: 20.0
  dropout: 0.0

# --- Training Schedule ---
# Identical to all other configs — only the model changes for a clean ablation.
batch_size: 4
iters: 600
learning_rate: 1e-5

lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [1e-5, 600]

mask_prompt: true

adapter_path: "adapters/qwen/age_5_11"

save_every: 100
steps_per_report: 10
steps_per_eval: 60
val_batches: -1
max_seq_length: 768
seed: 42
