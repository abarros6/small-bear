# age_5_11 adapter — Qwen 2.5 3B, fast config (rank 4, 8 layers)
# 36 transformer layers total; 8 layers adapted (22%).
# Train with: mlx_lm.lora --config configs/age_5_11_qwen25_3b_fast_lora.yaml

model: "mlx-community/Qwen2.5-3B-Instruct-4bit"
train: true
fine_tune_type: "lora"
data: "data/age_5_11"

num_layers: 8

lora_parameters:
  rank: 4
  scale: 20.0
  dropout: 0.0

batch_size: 4
iters: 600
learning_rate: 1e-5

lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [1e-5, 600]

mask_prompt: true

adapter_path: "adapters/qwen25_v2/age_5_11_qwen25_3b_fast_lora"

save_every: 100
steps_per_report: 10
steps_per_eval: 60
val_batches: -1
max_seq_length: 768
seed: 42
